name: CI and images

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      tags: ${{ steps.metadata.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for credentials
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --log-opts=--all --redact --no-banner

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install frontend dependencies
        run: bun install --cwd frontend --frozen-lockfile

      - name: Test publishing rules
        run: bun test scripts/ci-metadata.test.mjs

      - name: Validate versions and image metadata
        id: metadata
        run: bun scripts/ci-metadata.mjs

      - name: Require release commits to belong to main
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Run Rust tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          platforms: linux/amd64
          cache-from: type=gha,scope=backend-tests-amd64
          cache-to: type=gha,mode=max,scope=backend-tests-amd64

      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: datahelm:phase1
          build-args: |
            DATAHELM_VERSION=${{ steps.metadata.outputs.version }}
            DATAHELM_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=runtime-amd64
          cache-to: type=gha,mode=max,scope=runtime-amd64

      - name: Verify generated API contracts
        run: |
          bun scripts/generate-api.mjs --docker
          git diff --exit-code -- openapi.json frontend/src/api-types.ts

      - name: Build frontend
        run: bun run --cwd frontend build

      - name: Install Chrome for browser tests
        working-directory: frontend
        run: bunx --no-install playwright install --with-deps chrome

      - name: Test MongoDB 8 and browser workflows
        run: bun scripts/test-integration.mjs --skip-build --browser --topology-version=8

      - name: Test MongoDB 9
        run: bun scripts/test-integration.mjs --skip-build --topology-version=9

      - name: Test startup and persistence
        run: bun scripts/test-startup.mjs

      - name: Export tested image
        if: github.event_name == 'push' && github.repository == 'AmirHmZz/datahelm'
        run: docker save datahelm:phase1 -o "${{ runner.temp }}/datahelm-image.tar"

      - name: Upload tested image
        if: github.event_name == 'push' && github.repository == 'AmirHmZz/datahelm'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-image
          path: ${{ runner.temp }}/datahelm-image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish tested image
    needs: validate
    if: github.event_name == 'push' && github.repository == 'AmirHmZz/datahelm'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download tested image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-image
          path: ${{ runner.temp }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image aliases
        env:
          IMAGE_TAGS: ${{ needs.validate.outputs.tags }}
        run: |
          docker load -i "${{ runner.temp }}/datahelm-image.tar"
          while IFS= read -r tag; do
            docker tag datahelm:phase1 "$tag"
            docker push "$tag"
            printf '%s\n' "Published \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$IMAGE_TAGS"
